<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="paper">
    <feTurbulence
      type="fractalNoise"
      baseFrequency=".045 .085"
      numOctaves="3"
      seed="8"
      stitchTiles="stitch"
    />
    <feDiffuseLighting lighting-color="#fff" surfaceScale="2.2" diffuseConstant="1">
      <feDistantLight azimuth="225" elevation="45" />
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper)" />
</svg>
